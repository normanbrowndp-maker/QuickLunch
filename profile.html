<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickLunch — Профиль</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="profile-page">
    <header class="site-header">
      <div class="container header-inner">
        <a href="index.html" class="brand" aria-label="На главную страницу QuickLunch">QuickLunch</a>
        <nav class="main-nav" aria-label="Основная навигация">
          <ul>
            <li><a href="index.html">Главная</a></li>
            <li><a href="index.html#catalog">Каталог</a></li>
            <li><a href="cart.html">Корзина <span class="cart-badge" data-cart-count>0</span></a></li>
            <li><a href="profile.html">Профиль</a></li>
            <li><a href="chat.html">Чат</a></li>
            <li><a href="index.html#about-contacts">О нас</a></li>
          </ul>
        </nav>
        <a href="index.html#order" class="button button-primary">Оформить заказ</a>
      </div>
    </header>

    <main class="container section-spaced">
      <section class="profile-page">
        <div class="catalog-page__top">
          <div>
            <p class="eyebrow">Профиль</p>
            <h1>Личные данные</h1>
          </div>
          <button type="button" id="logout-button" class="button button-secondary">Выйти</button>
        </div>

        <form id="profile-form" class="profile-form">
          <label for="profile-name">Имя пользователя</label>
          <input id="profile-name" type="text" name="profile-name" />

          <label for="profile-email">Электронная почта</label>
          <input id="profile-email" type="email" name="profile-email" />

          <div class="profile-actions">
            <button type="submit" class="button button-primary">Сохранить</button>
            <button type="button" id="send-test-email" class="button button-secondary">Отправить тестовое письмо</button>
          </div>
        </form>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
